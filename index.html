<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>스터디아왕국-teen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Do+Hyeon&family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 폰 한 화면 앱. 크림 바탕 + 둥근 카드, 하단 탭. 넓은 화면에선 가운데 폰 틀 */
:root{
  --bg:#FBF4E6; --paper:#FFFDF8; --ink:#3A2C22; --muted:#8A7766; --line:#EADFCB;
  --accent:#F08A4B; --accent-ink:#FFFFFF; --accent-soft:#FDE6D3; --gold:#E2A93B;
  --good:#3E9B6B; --warn:#D9822B; --bad:#D2504A; --hp:#E5574F; --hp-bg:#F6DCD5;
  --night:#2E2440; --night-ink:#F6EEDD;
  --m:#3B7DD8; --e:#2FA06A; --k:#E0644B; --h:#A0703C; --s:#8C5BD6; --c:#1C9C9C;
  --f-display:'Jua','Gowun Dodum',system-ui,sans-serif;
  --f-body:'Noto Sans KR','Gowun Dodum',system-ui,-apple-system,sans-serif;
  --shadow:0 2px 0 rgba(90,60,30,.08),0 8px 24px rgba(90,60,30,.06);
}
/* 한 가지 밝은 톤으로 고정: 학생 화면은 픽셀 게임 세계, 학부모·선생님 화면은 크림 카드 */
:root{color-scheme:light}
html,body{height:100%}
/* 기기 호환: 아이폰 가로 글자 커짐 방지, 탭 하이라이트·더블탭 확대 방지, 입력칸 16px(아이폰 확대 방지) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,a,.opt,.chip,.check{touch-action:manipulation}
input,textarea,select{font-size:16px!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modebar{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;width:100%;max-width:420px}
.modebar button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-size:13px;color:var(--muted)}
.modebar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.phone{width:100%;max-width:420px;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media (min-width:700px){.phone{border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);height:820px;overflow:hidden;
  height:min(900px,calc(100vh - 104px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));height:min(900px,calc(100dvh - 104px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));min-height:560px;max-width:480px}
  .modebar{max-width:480px}}
@media (min-width:700px) and (max-height:680px){.phone{min-height:0;height:calc(100vh - 96px);height:calc(100dvh - 96px)}}
.screen{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* 태블릿·PC처럼 앱 틀 높이가 정해진 화면에서 카드가 눌려 글자가 잘리지 않게 */
.screen>*{flex-shrink:0}
html.big .shell{padding-block:8px;gap:8px;min-height:100vh;min-height:100dvh}
html.big .modebar{padding:3px}html.big .modebar button{padding:5px 10px}
html.big body:has(.phone.game){background:linear-gradient(#46B1D8 0,#86D9F0 50%,#B9ECF8 100%)}
html.big .phone{border-radius:22px}
.screen{flex:1;overflow-y:auto;padding:16px 14px 90px;display:flex;flex-direction:column;gap:12px}
@media (max-width:699px){.screen{padding-inline:0}}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:26px;line-height:1.25} h2{font-size:20px} h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{border:0;border-radius:16px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:18px;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-family:var(--f-body);font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.pill.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
input[type=text],input[type=password],textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:12px;font:inherit}
textarea{resize:vertical;min-height:72px}
.bar{height:12px;border-radius:999px;background:var(--hp-bg);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--hp);border-radius:999px;transition:width .5s}
.gauge > i{background:linear-gradient(90deg,var(--gold),var(--accent))}
.gauge{background:var(--accent-soft)}
/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
@media (max-width:699px){.nav{position:fixed;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}}
.nav button{flex:1;border:0;background:transparent;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
/* onboarding */
.story{background:var(--night);color:var(--night-ink);border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.story .q{font-family:var(--f-display);font-size:24px}
.rift{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#B48CFF 0%,#6C3FD1 35%,transparent 70%);opacity:.7;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.95}}
@media (prefers-reduced-motion:reduce){.rift{animation:none}}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 14px;text-align:left;width:100%;display:flex;gap:10px;align-items:flex-start}
.opt b{font-family:var(--f-display);font-weight:400;color:var(--accent);min-width:18px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--line);max-width:100%}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
/* character */
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;color:#fff;flex:none;position:relative}
.avatar::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid currentColor;opacity:.35}
.charcard{border-radius:24px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.charcard .dream{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;font-size:14px}
/* quests */
.quest{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper)}
.quest .dot{width:10px;align-self:stretch;border-radius:8px;flex:none}
.quest .body{flex:1;min-width:0}
.quest .t{font-weight:700}
.check{width:40px;height:40px;border-radius:14px;border:2px solid var(--line);background:var(--bg);flex:none;display:grid;place-items:center;font-size:20px}
.quest.done{opacity:.72}
.quest.done .check{background:var(--good);border-color:var(--good);color:#fff}
.quest.locked .check{opacity:.4}
.banner{border-radius:18px;padding:12px 14px;background:var(--night);color:var(--night-ink);display:flex;gap:10px;align-items:center}
.banner .d{font-family:var(--f-display);font-size:26px;color:var(--gold);line-height:1}
.bubble{background:var(--paper);border:1.5px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 12px;font-size:14px}
/* boss */
.arena{background:var(--night);color:var(--night-ink);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.arena .bossface{font-size:72px;text-align:center;line-height:1.1;transition:transform .15s}
.arena .bossface.hit{transform:translateX(6px) rotate(4deg);filter:brightness(1.6)}
.arena .bar{background:rgba(255,255,255,.15)}
.floatdmg{position:absolute;left:50%;top:70px;font-family:var(--f-display);font-size:30px;color:var(--gold);animation:up 1s forwards;pointer-events:none;transform:translateX(-50%)}
@keyframes up{to{transform:translate(-50%,-50px);opacity:0}}
.bosstabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.bosstabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:6px 10px;font-size:13px;white-space:nowrap;flex:none}
.bosstabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.timer{font-family:var(--f-display);font-size:40px;text-align:center;font-variant-numeric:tabular-nums}
/* emotion */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale button{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 2px;font-size:11px;line-height:1.25}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.faces button{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.faces button span{font-size:24px}
.faces button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fcoach{border:2px solid #2C4BE0;border-radius:14px;padding:12px 14px;margin-top:10px;background:rgba(44,75,224,.06)}
.ptiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.ptiles div{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}.ptiles b{font-size:17px;color:var(--accent);white-space:nowrap}.ptiles span{font-size:11px;color:var(--muted,#777)}
.pkv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.pkv div{display:flex;flex-direction:column}.pkv span{font-size:12px;color:var(--muted,#777)}
.stackbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--bg);margin:4px 0}
.wkbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.wkbars>div{display:flex;flex-direction:column;align-items:center;gap:3px}.wb{height:110px;width:100%;background:var(--bg);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}.wb i{display:block;width:100%;background:#F2A65A;border-radius:8px 8px 0 0}
.plist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}.pask{background:rgba(44,75,224,.07);border-radius:12px;padding:10px 12px;margin-top:8px}
@media print{.nav,.modebar,.noprint,#foot,.sbar,.shint{display:none!important}body,#phone,#screen{background:#fff!important;overflow:visible!important;height:auto!important}}
.corecard{border:2px solid var(--line)}
.coregrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.corebtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border:2px solid var(--line);border-radius:14px;background:var(--paper,#fff);color:inherit;font:inherit;text-align:center}
.corebtn[aria-pressed="true"]{border-color:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 30%,transparent)}
.coresp.awake canvas,.partner.awake canvas{filter:drop-shadow(0 0 6px #FFE680) drop-shadow(0 0 2px #F7C531)}
.partner{position:absolute;bottom:60px;left:132px;z-index:2;animation:bob .9s steps(2) infinite .2s}
.partner.pdash{animation:pdash .62s steps(8) 1;z-index:4}
@keyframes pdash{0%{transform:translate(0,0)}35%{transform:translate(var(--dx,150px),-26px)}50%{transform:translate(var(--dx,150px),0) scale(1.15)}100%{transform:translate(0,0)}}
.partner.wob{animation:wob .5s steps(4) 2}
@keyframes wob{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@media (prefers-reduced-motion: reduce){.partner.pdash,.partner.wob{animation:none}}
.flowgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.flowgrid div{border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.flowgrid div.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.flowgrid div.blank{visibility:hidden}
/* ranking */
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:7px 4px;font-size:13px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.rank{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line)}
.rank:last-child{border-bottom:0}
.rank .no{width:26px;text-align:center;font-family:var(--f-display);font-size:18px}
.rank .mini{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--f-display)}
.rank.me{background:var(--accent-soft);border-radius:12px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line)}
.table td.r,.table th.r{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:20;max-width:90%;text-align:center}
@media (max-width:699px){.toast{position:fixed}}
.sheet{position:absolute;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:flex-end;z-index:30}
@media (max-width:699px){.sheet{position:fixed}}
.sheet .in{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:85%;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
svg text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}

/* ===== 픽셀 게임 톤 (학생 화면) ===== */
:root{--px:0 -3px 0 0 #2B1D16,0 3px 0 0 #2B1D16,-3px 0 0 0 #2B1D16,3px 0 0 0 #2B1D16,0 7px 0 0 rgba(43,29,22,.3);
  --px2:0 -2px 0 #2B1D16,0 2px 0 #2B1D16,-2px 0 0 #2B1D16,2px 0 0 #2B1D16;
  --f-title:'Do Hyeon','Jua',system-ui,sans-serif; --f-pixel:'Press Start 2P',ui-monospace,monospace}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
.phone.game{--bg:#86D9F0;--paper:#FFF4D6;--ink:#2B1D16;--muted:#6E5844;--line:#2B1D16;--accent:#E2453C;--accent-ink:#fff;--accent-soft:#F7C531;--gold:#F7C531;--good:#3E9B4B;--hp:#E2453C;--hp-bg:#4A2A22;--night:#2E2440;--night-ink:#F6E3B4;
  background:linear-gradient(#46B1D8 0,#86D9F0 260px,#B9ECF8 100%);color:var(--ink)}
.game .screen{gap:10px}
.game h1{font-family:var(--f-title);font-size:30px;color:#F9DDB6;letter-spacing:1px;text-shadow:2px 0 #2B1D16,-2px 0 #2B1D16,0 2px #2B1D16,0 -2px #2B1D16,2px 2px #2B1D16,-2px -2px #2B1D16,2px -2px #2B1D16,-2px 2px #2B1D16,0 5px #2B1D16}
.game h2,.game h3{font-family:var(--f-title)} .game h2{font-size:22px} .game h3{font-size:19px}
.game .card{border:0;border-radius:0;box-shadow:var(--px);margin:3px;background:var(--paper)}
.game .btn{border-radius:0;box-shadow:var(--px);margin:3px;width:calc(100% - 6px);font-family:var(--f-title);font-size:20px;background:#E2453C;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.game .btn:active{transform:translateY(3px)}
.game .btn.ghost{background:#F6E3B4;color:var(--ink);border:0;text-shadow:none;font-size:17px}
.game .btn.gold{background:#F7C531;color:var(--ink);text-shadow:none}
.game .chip{border:0;border-radius:0;background:#F6E3B4;box-shadow:var(--px2);margin:2px}
.game .chip[aria-pressed="true"]{background:#2B1D16;color:#F7C531}

   억까탈출 공화국 [멘탈 보호막]은 그 달 첫 회복 1회를 막아 줘요. 오늘 공부로 막을 수 있게 어제까지만 계산해요. */
const HEAL_DAYS=3,HEAL_PCT=5;
function bossTrack(s,mk,st){st=st||S;const hp=SUBJ[s].hp,y=+mk.slice(0,4),m=+mk.slice(5,7),last=new Date(y,m,0).getDate(),today=TODAY();
  const E=st.event2,gift=E&&E.mk===mk&&E.boss?(E.boss[s]||0):0,jd=joinedDay(st)||'';
  let eff=gift,streak=0,heals=[],shield=(st.char&&st.char.kingdom==='ukk')?1:0,blocked=0;const hk=1-.5*coreBuffFor('ever',st,mk);
  for(let d=1;d<=last;d++){const k=ymd(y,m,d);if(k>today)break;const dm=dayBossDmg(s,k,st);eff+=dm;
    if(k===today)break;if(k<jd)continue;
    if(dm>0)streak=0;else if(st.shields&&st.shields[k]){/* 스트릭 방패 날: 반격 없음 */}else{streak++;if(streak%HEAL_DAYS===0&&eff>0&&eff<hp){if(shield){shield=0;blocked++}else{const h=Math.min(eff,Math.round(hp*HEAL_PCT/100*hk));eff-=h;heals.push({k,h})}}}}
  return {eff,heals,blocked,streak}}
function monthBossDmg(s,mk,st){return bossTrack(s,mk,st).eff}
function bossLeft(s,mk){return Math.max(0,SUBJ[s].hp-monthBossDmg(s,mk||monthKeyOf(TODAY())))}
function raidInst(r,today){today=today||TODAY();const y=+today.slice(0,4);let best=null;
  [y-1,y,y+1].forEach(yy=>r.specs.forEach(sp=>{const openStart=ymd(yy,sp.m,sp.day||1);const openEnd=ymd(yy,sp.m+1,0);
    const accStart=r.vac?openStart:sp.incl?ymd(yy,sp.m-(sp.n-1),1):ymd(yy,sp.m-sp.n,1);const oEnd=r.vac?ymd(yy,sp.m+sp.n,0):openEnd;
    if(oEnd>=today&&(!best||oEnd<best.openEnd))best={r,sp,openStart,openEnd:oEnd,accStart,id:r.id+'-'+openStart}}));
  const b=best,vac=!!r.vac,cap=vac?0:b.sp.n*BASE*10,hp=vac?b.sp.n*BASE*10:cap+1500;const open=today>=b.openStart;
  const bonus=vac?0:Math.min(cap,preFill(b.accStart,addDays(b.openStart,-1)));
  const adj=vac?0:Number((S.raidAdj||{})[r.id+'-'+b.openStart]||0);/* 선생님이 학생별로 충전 게이지를 조정 (예: 소급 입력한 학생) */
  const charge=vac?0:Math.max(0,dmgIn(b.accStart,open?addDays(b.openStart,-1):today)+bonus+adj);
  const items=(S.itemUse||[]).filter(u=>u.inst===b.id).reduce((a,u)=>a+u.dmg,0);
  const direct=open?dmgIn(b.openStart,today)+items:0;
  const left=open?Math.max(0,hp-Math.min(charge,cap)-direct):hp;
  return {...b,vac,cap,hp,open,charge,bonus,direct,items,left}}

let writeTimer=null,retryTimer=null,flushing=false,flushAgain=false,SYNC='idle',failCount=0;
function computeDaily(st){const out={};const ks=Object.keys(st.logs||{});m1Days(st).forEach(d=>{if(!ks.includes(d))ks.push(d)});ks.forEach(k=>{const d=dayScoreOf(st,k);if(d.raw||st.emo&&st.emo[k])out[k]={r:d.rank,raw:d.raw,min:d.min,n:d.subjects,cell:st.emo&&st.emo[k]?st.emo[k].cell:null,hr:st.logs[k]&&st.logs[k].hiddenReq&&!st.logs[k].hidden?1:0};if(d.m1&&out[k])out[k].m1=d.m1});return out}
function isDirty(){try{return localStorage.getItem(KEY()+':dirty')==='1'}catch(e){return false}}
function setDirty(v){try{v?localStorage.setItem(KEY()+':dirty','1'):localStorage.removeItem(KEY()+':dirty')}catch(e){}}
function cacheLocal(){try{localStorage.setItem(KEY(),JSON.stringify(S))}catch(e){}}
function save(){
  if(READONLY)return;S.rev=(S.rev||0)+1;S.daily=computeDaily(S);cacheLocal();
  if(MODE_DB){setDirty(true);setSync('wait');clearTimeout(writeTimer);writeTimer=setTimeout(flush,1200)}}
async function flush(){
  if(!MODE_DB||READONLY)return;clearTimeout(writeTimer);clearTimeout(retryTimer);
  if(flushing){flushAgain=true;return}
  flushing=true;const sentRev=S.rev;setSync('saving');
  try{const j=await api('save',{state:JSON.stringify(S),rev:S.rev});
    const changed=S.rev!==sentRev;S.rev=Math.max(S.rev||0,j.rev||0);mergeApprovals(j.approved);mergeBonus(j.bonus);cacheLocal();
    if(!changed)setDirty(false);failCount=0;setSync(changed?'wait':'ok')}
  catch(e){if(e.code==='auth'){flushing=false;forceLogout(e.message);return}
    failCount++;setSync('fail');
    if(e.code!=='network'&&e.code!=='timeout'&&failCount<=2&&window.RR_REPORT)RR_REPORT('저장 실패: '+e.message,'',e.code);
    retryTimer=setTimeout(flush,Math.min(60000,5000*failCount))}
  finally{flushing=false;if(flushAgain){flushAgain=false;flush()}}}
/* 보너스 체크: 서버 응답(load·save)의 bonus 를 합쳐요(숙제검사 점수·가호, 스트릭 방패). 옛 서버면 bonus 가 없어서 아무것도 안 해요 */
function mergeBonus(b){if(!b||READONLY||!S)return;const snap=()=>JSON.stringify([S.m1||null,S.bless||null,S.shields||null,S.hwReq||'',S.shieldReq||'']);const was=snap();
  const oldC=S.m1&&S.m1.checks||{},oldSh=S.shields||{};
  S.m1={n:b.n,pts:b.pts,checks:b.checks||{}};
  if(b.last&&b.until&&b.until>=TODAY()){if(!S.bless||S.bless.until<b.until)S.bless={from:b.last,until:b.until,admin:1}}else if(S.bless&&S.bless.admin)delete S.bless;
  const sh={};(b.shields||[]).forEach(d=>sh[d]=1);S.shields=sh;
  if(S.hwReq&&b.last&&b.last>=S.hwReq)delete S.hwReq;
  const denied=S.shieldReq&&(b.denied||[]).includes(S.shieldReq);if(S.shieldReq&&(sh[S.shieldReq]||denied))delete S.shieldReq;
  if(was===snap())return;
  S.daily=computeDaily(S);cacheLocal();
  const newC=Object.keys(S.m1.checks).find(d=>!oldC[d]),newSh=Object.keys(sh).find(d=>!oldSh[d]);
  if(newC){toast('숙제검사 통과! +'+S.m1.checks[newC]+'점 · 마스터의 가호 7일');SND.play('kill')}
  else if(newSh){toast('마스터가 '+fmt(newSh)+' 스트릭 방패를 허가했어요! 연속 출석이 이어져요');SND.play('item')}
  else if(denied)toast('이번 방패는 허가되지 않았어요');
  if(canRerender())render()}
function mergeApprovals(dates){let ch=false;(dates||[]).forEach(d=>{const L=S.logs&&S.logs[d];if(L&&!L.hidden){L.hidden=1;ch=true}});
  if(ch){S.daily=computeDaily(S);cacheLocal();toast('선생님이 외우기를 인증했어요! 오늘 외우기 5점');if(canRerender())render()}}
function savePrivate(){try{localStorage.setItem(KEY()+':priv',JSON.stringify(PRIV))}catch(e){}
  if(!MODE_DB)return;api('savePrivate',{priv:PRIV}).catch(e=>{if(e.code==='auth')forceLogout(e.message)})}
function newCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let c='';for(let i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
async function api(action,data,opt){
  if(!API){const e=new Error('서버 주소가 없어요');e.code='offline';throw e}
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;const to=setTimeout(()=>ctl&&ctl.abort(),(opt&&opt.timeout)||30000);
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:AUTH&&AUTH.token||''},data||{})),signal:ctl?ctl.signal:undefined,keepalive:!!(opt&&opt.keepalive)});
    let j;try{j=await r.json()}catch(x){const e=new Error('서버 응답을 읽지 못했어요');e.code='server';throw e}
    if(!j.ok){const e=new Error(j.error||'오류가 났어요');e.code=j.code||'server';throw e}return j}
  catch(e){if(e.name==='AbortError'){const x=new Error('인터넷이 느려요');x.code='timeout';throw x}if(!e.code){e.code='network';e.message='인터넷 연결을 확인해 주세요'}throw e}
  finally{clearTimeout(to)}}
function setSync(s){SYNC=s;setFoot()}
function forceLogout(msg){AUTH=null;try{localStorage.removeItem(AUTH_KEY)}catch(e){}MODE_DB=false;NEED_LOGIN=true;LOADING=false;S=freshState();ALL={};setFoot();render();if(msg)toast(msg)}
let rosterTimer=null;
function loadRoster(){if(!MODE_DB)return;api('roster').then(j=>{ALL=j.students||{};mergeApprovals(j.approved);if(UI.mode==='student'&&UI.tab==='rank'&&canRerender())render()}).catch(e=>{if(e.code==='auth')forceLogout(e.message)})}
async function startSession(){
  MODE_DB=true;NEED_LOGIN=false;const cached=load();
  try{PRIV={text:{},...JSON.parse(localStorage.getItem(KEY()+':priv')||'{}')}}catch(e){}
  if(cached){S=cached;LOADING=false}else{S=freshState();LOADING=true}
  setSync(isDirty()?'wait':'loading');render();
  try{const j=await api('load');
    if(j.priv)PRIV={text:{},...j.priv};
    const remote=j.state?JSON.parse(j.state):null;const was=LOADING;
    if(isDirty()&&cached){/* 이 기기에 아직 안 올라간 기록이 있으면 그걸 먼저 올림 */}
    else if(remote){S=remote;if(!S.rev)S.rev=j.rev||0}
    if(j.parentCode)S.code=j.parentCode;if(j.name)AUTH.name=j.name;
    /* 선생님이 계정 만들 때 고른 중등/고등: 학생이 아직 안 골랐으면 미리 채움 (나 탭에서 바꿀 수 있음) */
    if((j.school==='mid'||j.school==='high')&&!S.school){if(S.char)S.school=j.school;else UI.ob.draft.school=UI.ob.draft.school||j.school}
    mergeApprovals(j.approved);mergeBonus(j.bonus);cacheLocal();LOADING=false;
    if(isDirty())flush();else setSync('ok');
    if(was||canRerender()||!S.char)render()}
  catch(e){if(e.code==='auth'){forceLogout(e.message);return}
    LOADING=false;setSync('offline');render();
    if(!cached)toast('서버에 연결하지 못했어요. 잠시 후 다시 열어 주세요');
    setTimeout(()=>{if(MODE_DB&&SYNC==='offline')startSession()},20000);return}
  loadRoster();clearInterval(rosterTimer);rosterTimer=setInterval(()=>{if(!document.hidden)loadRoster()},60000)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(MODE_DB&&isDirty())flush()}else{checkVersion();if(MODE_DB)loadRoster()}});
window.addEventListener('pagehide',()=>{if(!MODE_DB||!isDirty())return;const body=JSON.stringify(S);if(body.length<60000)api('save',{state:body,rev:S.rev},{keepalive:true}).catch(()=>{});else flush()});
window.addEventListener('online',()=>{if(MODE_DB&&isDirty())flush()});
/* 새 버전 알림: 깃허브에 새로 올리면 version.json 이 바뀌고, 학생 화면에 '새 버전' 버튼이 떠요 */
let lastVerCheck=0;
function checkVersion(){if(location.protocol==='file:'||Date.now()-lastVerCheck<60000)return;lastVerCheck=Date.now();
  fetch(BASE_URL+'version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(v=>{if(v&&v.version&&v.version!==APP_VERSION&&!document.getElementById('upd'))showUpdate(v)}).catch(()=>{})}
function showUpdate(v){const d=document.createElement('div');d.id='upd';d.className='upd';d.innerHTML=`<span>새 버전이 나왔어요${v.note?': '+esc(v.note):''}</span><button>새로 고침</button>`;
  d.querySelector('button').onclick=async()=>{d.querySelector('button').disabled=true;if(MODE_DB&&isDirty())await flush();location.replace(BASE_URL+'?v='+encodeURIComponent(v.version)+location.hash)};document.body.appendChild(d)}
setInterval(checkVersion,10*60000);
let UI={tab:'today',mode:PARENT_CODE?'parent':'student',ob:{step:0,q:0,ans:[],draft:{}},boss:'m',rankTab:'today',parentTab:'day',timer:null};

/* 날짜: 새벽 2시까지는 전날로 친다 */
function dayKey(d){const t=new Date((d||new Date()).getTime()-2*3600e3);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function parseDay(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parseDay(k);d.setDate(d.getDate()+n);return dayKey(new Date(d.getTime()+2*3600e3+1))}
function weekKey(k){const d=parseDay(k);const wd=(d.getDay()+6)%7;return addDays(k,-wd)}
function fmt(k){const d=parseDay(k);return (d.getMonth()+1)+'/'+d.getDate()+'('+'일월화수목금토'[d.getDay()]+')'}
const TODAY=()=>dayKey();
function dday(){const t=parseDay(TODAY()),e=parseDay(LECTURE_DEADLINE);return Math.round((e-t)/864e5)}

/* ---------- 오늘의 퀘스트 ---------- */
const SAMPLE_PLAN={1:[['m','lec'],['e','lv1'],['e','word']],2:[['k','sum'],['c','read'],['e','word']],3:[['m','lec'],['m','lv1'],['e','word']],
  4:[['e','lv2'],['h','lec'],['e','word']],5:[['m','wrong'],['s','mem'],['m','hw']],6:[['m','lec'],['c','sum']],0:[]};
function getPlan(){if(!S.plan){S.plan={};Object.keys(SAMPLE_PLAN).forEach(d=>S.plan[d]=SAMPLE_PLAN[d].map(([s,a])=>({s,a})))}return S.plan}
function defaultQuests(k){const wd=parseDay(k).getDay();return (getPlan()[wd]||[]).map(x=>({s:x.s,a:x.a}))}
function syncTodayWithPlan(){const k=TODAY();const L=S.logs[k];if(!L)return;
  const keep=L.q.filter(q=>q.done||q.extra);const used=keep.filter(q=>!q.extra).map(q=>q.s+q.a);
  const add=defaultQuests(k).filter(x=>{const i=used.indexOf(x.s+x.a);if(i>=0){used.splice(i,1);return false}return true}).map(x=>({...x,done:false}));
  L.q=[...keep.filter(q=>!q.extra),...add,...keep.filter(q=>q.extra)]}
function log(k){k=k||TODAY();if(!S.logs[k])S.logs[k]={q:defaultQuests(k).map(q=>({...q,done:false})),life:{},hidden:0,streakChecked:false};return S.logs[k]}
function questPts(q){return q.pts||ACT[q.a].pt}
function dayScore(k){return dayScoreOf(S,k)}
/* 히든미션 '마스터의 가호 · 숙제검사': 마스터(관리자)가 학생마다 횟수를 정하고(1번 3점) 체크하면 그날 +점수 (하루 45점 상한 밖) + 마스터의 가호 7일. st.m1={n,pts,checks:{날짜:점수}} 는 서버가 넣어 줘요 */
const HW_UNIT=3;
function m1Of(st,k){const c=st&&st.m1&&st.m1.checks;return c&&c[k]?Number(c[k])||0:0}
function m1Days(st){return Object.keys(st&&st.m1&&st.m1.checks||{})}
function dayScoreOf(st,k){const L=(st.logs||{})[k];const m1=m1Of(st,k);if(!L)return {raw:m1,rank:m1,min:0,subjects:0,m1};
  let raw=0,min=0;const subs=new Set();
  L.q.forEach(q=>{if(q.done){raw+=qPts(q,L);min+=q.min||actMin(q.a,q.s);subs.add(q.s)}});
  Object.keys(L.life).forEach(a=>{if(L.life[a])raw+=ACT[a].pt});
  const eb=L.early&&L.early.pts||0;
  return {raw:raw+eb+m1,rank:Math.min(raw,DAILY_CAP)+eb+m1,min,subjects:subs.size,early:eb,m1}}
/* 자정 전 마감 보너스: 그날 퀘스트를 다 끝내고 밤 12시 전에 '오늘 끝!'을 누르면 그날 점수의 1% (올림, 최소 1점) */
const EARLY_PCT=1;
function calToday(){const d=new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate())}
function earlyPts(k){const s=dayScore(k);return Math.max(1,Math.ceil((s.raw-(s.early||0)-(s.m1||0))*EARLY_PCT/100))}
function earlyOpen(k){const L=S.logs[k];return !!L&&!L.early&&calToday()===k}
/* 올클리어: 6과목(국영수사과한) 퀘스트만 봐요. 영단어 퀘스트는 빼요 */
function allDone(k){const L=S.logs[k];const qs=L?L.q.filter(q=>q.a!=='word'&&SUBJ[q.s]):[];return qs.length>0&&qs.every(q=>q.done)}
function studied(k){return !!(S.logs[k]&&S.logs[k].q.some(q=>q.done))}
/* 연속 출석: 마스터가 허가한 스트릭 방패 날(S.shields)은 끊기지 않고 건너뛰어요 (날 수에는 안 들어감) */
function streak(){let n=0,k=TODAY();if(!studied(k))k=addDays(k,-1);
  for(let g=0;g<400;g++){if(studied(k))n++;else if(!(S.shields&&S.shields[k]))break;k=addDays(k,-1)}return n}
function weekScore(k){const w=weekKey(k||TODAY());let t=0;for(let i=0;i<7;i++)t+=dayScore(addDays(w,i)).rank;return t}
function logKeys(){const ks=Object.keys(S.logs);m1Days(S).forEach(d=>{if(!S.logs[d])ks.push(d)});return ks}
function monthScore(){const k=TODAY();const pre=k.slice(0,7);return logKeys().filter(x=>x.startsWith(pre)).reduce((a,x)=>a+dayScore(x).rank,0)}

/* 강의 보너스: 12/6까지, 과목마다 주 1회 +1 */
function lectureBonusAvailable(s,k){if(k>LECTURE_DEADLINE)return false;const w=weekKey(k);return !(S.bonus[w]&&S.bonus[w][s])}

/* ---------- 가디언 코어(알): 매달 하나 골라 이달 점수(원점수)로 키워요. 30점 부화 · 150점 성장(버프 1.5배) · 300점 각성 ---------- */
const CORES={
  blaze:{n:'블레이즈 코어',egg:'불꽃알',c:'#E2453C',st:['미각성 코어','아기 드레이크','드레이크','이그니스 드래곤'],buff:'랜덤 크리티컬 확률 +5%',buff2:'랜덤 크리티컬 확률 +7.5%',who:'크리티컬 손맛을 노리는 타입'},
  ever:{n:'에버그린 코어',egg:'비취알',c:'#2E9E6B',st:['미각성 코어','아기 숲부엉이','숲부엉이','가디언 아울'],buff:'보스 반격(3일 쉬면 HP 회복) 회복량 절반',buff2:'보스 반격 회복량 75% 감소',who:'가끔 쉬는 날이 생기는 타입',later:'12월: 스트릭 방패 조건 5일 → 4일'},
  aegis:{n:'이지스 코어',egg:'강철알',c:'#7C8799',st:['미각성 코어','미니 메카봇','메카봇','이지스 나이트'],buff:'힘든 날(마음 체크 컨디션 1~2) 데미지 +20%',buff2:'힘든 날 데미지 +30%',who:'컨디션이 들쭉날쭉한 타입',later:'12월: 최소 시동 퀘스트 데미지 2배'},
  tidal:{n:'타이달 코어',egg:'심해알',c:'#2F6FD6',st:['미각성 코어','아기 수정여우','수정여우','아쿠아 울프'],buff:'내가 고른 약점 과목 데미지 +20%',buff2:'약점 과목 데미지 +30%',who:'싫은 과목을 잡고 싶은 타입'}};
const CORE_TH=[0,30,150,300];
function coreOf(st,mk){st=st||S;mk=mk||monthKeyOf(TODAY());const c=st.core;return c&&c.m===mk&&CORES[c.type]?c:null}
function coreXP(st,mk){st=st||S;mk=mk||monthKeyOf(TODAY());return Object.keys(st.logs||{}).filter(x=>x.startsWith(mk)).reduce((a,x)=>a+dayScoreOf(st,x).raw,0)+attEggXP(st,mk)}

/* ---------- 출석 체크: 접속하면 도장 자리가 생기고(잠김), 공부 퀘스트 1개를 끝내야 도장이 찍히고 출석 상자가 열려요 ----------
   출석 상자 = 궁극기 게이지 +20% (하루 1번, 오늘만) · 한 주(월~일)에 도장 5개 = 주간 선물 알(가디언 코어) +5점.
   둘 다 랭킹·학부모 리포트 점수에는 안 들어가요 (게이지는 데미지, 알 점수는 코어 성장에만). */
const ATT={gauge:20,need:5,egg:5};
function attEggXP(st,mk){const w=(st&&st.attWk)||{};return Object.keys(w).filter(x=>w[x]&&String(w[x].at||'').startsWith(mk)).reduce((a,x)=>a+(w[x].xp||0),0)}
function attStudied(k,st){st=st||S;const L=(st.logs||{})[k];return !!L&&L.q.some(q=>q.done)}
function attWeekDays(k){const w=weekKey(k||TODAY());return [...Array(7)].map((_,i)=>addDays(w,i))}
function attStamps(k,st){return attWeekDays(k).filter(d=>attStudied(d,st)).length}
function attBoxReady(){const k=TODAY();return attStudied(k)&&!((S.att||{})[k]||{}).ok}
function attWeekReady(){const k=TODAY();return attStamps(k)>=ATT.need&&!(S.attWk||{})[weekKey(k)]}
function attMark(){if(READONLY||!S.char||UI.mode!=='student')return;const k=TODAY();S.att=S.att||{};if(S.att[k])return;
  S.att[k]={v:Date.now()};const old=addDays(k,-70);Object.keys(S.att).forEach(d=>{if(d<old)delete S.att[d]});save();
  if(!attStudied(k))setTimeout(()=>{toast('출석 도장 자리 확보! 공부 1개 끝내면 쾅 찍히고 상자가 열려');SND.play('item')},700)}
function attEggSpr(){return 'core-'+((S.core&&CORES[S.core.type]&&S.core.type)||'blaze')+'-0'}
/* 출석 카드: 이번 주 1일차~7일차. N번째 도장 = 그 주에 공부한 N번째 날. 5일차 = 주간 선물(알 +5점) */
function attSlots(){const k=TODAY(),A=S.att||{},days=attWeekDays(k).filter(d=>attStudied(d)),out=[];
  for(let i=0;i<7;i++){const d=days[i];let st;
    if(d)st=(d===k&&!(A[k]||{}).ok)?'ready':'done';
    else if(i===days.length&&!attStudied(k))st='lock';else st='fut';
    out.push({n:i+1,d,st,egg:i===ATT.need-1})}

function attSlotHTML(o,big){const rw=o.egg?`<span data-spr="${attEggSpr()}" data-sc="${big?5:3}"></span><b class="num">알 +${ATT.egg}</b>`:`<span data-spr="bolt" data-sc="${big?6:4}"></span><b class="num">+${ATT.gauge}%</b>`;

function damageFor(q,L){

  /* 랜덤 크리티컬: 퀘스트마다 한 번 뽑은 값(q.roll)을 저장해서 체크를 풀었다 다시 눌러도 결과가 같아요. 점수는 그대로, 데미지만. */
  if(q.roll==null)q.roll=Math.random();let ck='';
  {const cb=coreBuffFor('blaze')*.05;const rc=q.roll<CRIT.mega?2:q.roll<CRIT.mega+CRIT.crit+cb?1.5:1;if(rc>crit){crit=rc;ck=rc===2?'mega':'crit';why.push(rc===2?'MEGA HIT ×2':'CRITICAL ×1.5')}}
  {const lv=coreBuffFor('aegis');const e=S.emo[TODAY()];if(lv&&e&&e.cond&&e.cond<=2){const b=Math.round(20*lv);bonus+=b;why.push('이지스 코어 +'+b+'%')}}
  {const lv=coreBuffFor('tidal');if(lv&&S.core&&q.s===S.core.weak){const b=Math.round(20*lv);bonus+=b;why.push('타이달 코어 +'+b+'%')}}

function toggleQuest(i){
  const k=TODAY(),L=log(k),q=L.q[i];
  if(!q.done){
    const lim=dayLimit(L,q);if(lim){toast(lim);return}
    if(q.a==='lec'){q.no=S.lecNo[q.s]++;if(lectureBonusAvailable(q.s,k)){q.pts=6;(S.bonus[weekKey(k)]=S.bonus[weekKey(k)]||{})[q.s]=1}else q.pts=5}
    const mk=monthKeyOf(k);const before=monthBossDmg(q.s,mk);const attFirst=!attStudied(k);
    q.done=true;q.at=Date.now();(S.att=S.att||{})[k]=S.att[k]||{v:Date.now()};
    const r=damageFor(q,L);q.dmg=r.dmg;
    let blessNew=false;if(q.a==='hw'){S.bless={from:k,until:addDays(k,6)};q.blessed=1;blessNew=true}
    save();
    UI.pendingFx={s:q.s,before,dmg:r.dmg,pts:questPts(q),why:r.why,crit:r.crit,combo:L.q.filter(x=>x.done).length,killed:before<SUBJ[q.s].hp&&before+r.dmg>=SUBJ[q.s].hp,bless:blessNew};
    UI.tab='boss';UI.boss=q.s;render();toTop();if(attFirst)setTimeout(()=>toast('출석 도장 준비 완료! 오늘 탭에서 도장을 찍어 봐'),3200);return;
  } else {
    q.done=false;delete q.dmg;if(q.blessed&&S.bless&&S.bless.from===k){delete S.bless;delete q.blessed}
    if(q.a==='lec'){S.lecNo[q.s]=Math.max(1,S.lecNo[q.s]-1);if(q.pts===6&&S.bonus[weekKey(k)])delete S.bonus[weekKey(k)][q.s];delete q.no;delete q.pts}
    q.cancelled=(q.cancelled||0)+1;attUndo(k);save();toast('체크를 취소했어요 (취소 기록은 남아요)');
  }
  render();
}

function emoQuestions(){

  const day=parseDay(k).getDate();const pick=(g,n)=>{const out=[];for(let j=0;j<n;j++)out.push((day*2+j)%5);return out};
  ['S','C','F'].forEach(g=>pick(g,2).forEach(i=>{const x=EQ[g][i];qs.push({t:g,q:x[0],rev:x[1]===1,i})}));

      ${n<2?'<p class="small muted" style="padding-top:6px">같이 하는 친구가 캐릭터를 만들면 여기에 함께 나와요.</p>':''}</div>

    if(t==='week'||t==='month'){const prev=t==='week'?periodKeys('lastweek'):prevMonthKeys();
      const g=people.map(p=>{const a=sumDays(p.d,prev),b=sumDays(p.d,keys);return {n:p.d.char.name,a,b,me:p.id===me}}).filter(x=>x.a>0).map(x=>({...x,g:Math.round((x.b-x.a)/x.a*100)})).sort((x,y)=>y.g-x.g);

  }
  scr.innerHTML=h;scr.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{UI.rankTab=b.dataset.t;render()});

/* 학생용 약식 공부 시간 리포트 */
function hm(m){m=Math.round(m||0);const h=Math.floor(m/60),r=m%60;return h?(h+'시간'+(r?' '+r+'분':'')):r+'분'}
function minIn(keys){return keys.reduce((a,k)=>a+dayScore(k).min,0)}
function weekDays(k){const w=weekKey(k||TODAY());return [...Array(7)].map((_,i)=>addDays(w,i))}

  const wk=minIn(days),lw=minIn(lastW),mo=minIn(mdays),dmins=days.map(d=>dayScore(d).min),mx=Math.max(60,...dmins);
  const sub={};days.forEach(d=>{const L=S.logs[d];if(L)L.q.filter(q=>q.done).forEach(q=>{sub[q.s]=(sub[q.s]||0)+actMin(q.a,q.s)})});
  const studied=mdays.filter(d=>dayScore(d).min>0).length;const diff=wk-lw;
  return `<div class="card"><div class="row between"><h3>내 공부 시간</h3><span class="tiny muted">퀘스트 기준 예상 시간</span></div>
    <div class="row" style="justify-content:space-around;text-align:center">
      <div><p class="tiny muted">오늘</p><p class="num" style="font-family:var(--f-title);font-size:22px">${hm(dayScore(k).min)}</p></div>
      <div><p class="tiny muted">이번 주</p><p class="num" style="font-family:var(--f-title);font-size:22px">${hm(wk)}</p></div>
      <div><p class="tiny muted">${Number(mk.slice(5))}월</p><p class="num" style="font-family:var(--f-title);font-size:22px">${hm(mo)}</p></div></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:84px">${days.map((d,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end"><span class="tiny num">${dmins[i]?Math.round(dmins[i]/6)/10:''}</span><i style="display:block;width:70%;height:${Math.round(dmins[i]/mx*56)}px;min-height:${dmins[i]?3:0}px;background:${d===k?'#E2453C':'#F7C531'};box-shadow:var(--px2)"></i><span class="tiny" style="${d===k?'font-weight:700':''}">${'월화수목금토일'[i]}</span></div>`).join('')}</div>
    ${Object.keys(sub).length?`<div class="chips">${Object.keys(SUBJ).filter(x=>sub[x]).map(x=>`<span class="pill">${SUBJ[x].n} ${hm(sub[x])}</span>`).join('')}</div>`:''}
    <p class="tiny muted">${lw?`지난주보다 ${diff>=0?'+':'-'}${hm(Math.abs(diff))}`:'지난주 기록이 쌓이면 비교해 줄게'} · 이달 공부한 날 ${studied}일 · 막대 숫자는 시간</p></div>`}

/* ---------- 학부모 리포트: 몰입 8채널 그림과 주간 리포트 ---------- */
/* 칙센트미하이 몰입 8채널 모델(Finding Flow, 1997). 아이의 마음 체크 답(난이도·익숙함 1~5점)으로 위치를 정해요. */
const FLOW_RING=['몰입','각성','불안','걱정','무관심','지루함','이완','통제'];
const FLOW_ANG={몰입:-45,각성:-90,불안:-135,걱정:180,무관심:135,지루함:90,이완:45,통제:0};
const FLOW_COL={몰입:'#6F86F0',각성:'#8FA0F2',불안:'#E39A95',걱정:'#EEC3C0',무관심:'#B9BCC4',지루함:'#E6CFAE',이완:'#A9CDBA',통제:'#B9C3F4'};
const FLOW_INFO={

function flowStep(c){const i=FLOW_RING.indexOf(c);if(i<=0||c==='무관심')return null;return FLOW_RING[i<=4?i-1:(i+1)%8]}
/* pts: [{d,e}] — e는 S.emo[날짜] */
function flowSVG(pts,opt){opt=opt||{};const W=300,c=W/2,R=W*0.9;

  FLOW_RING.forEach(n=>{const a=FLOW_ANG[n],[x1,y1]=pt(a-22.5),[x2,y2]=pt(a+22.5);g+=`<polygon points="${c},${c} ${x1},${y1} ${x2},${y2}" fill="${FLOW_COL[n]}" fill-opacity="${opt.focus&&opt.focus!==n?.38:.72}" stroke="#fff" stroke-width="1.5"/>`});
  g+=`</g><rect x="0" y="0" width="${W}" height="${W}" fill="none" stroke="#1F2A44" stroke-width="1.5"/>`;
  FLOW_RING.forEach(n=>{const a=FLOW_ANG[n]*Math.PI/180,r=W*0.4;const x=c+Math.cos(a)*r,y=c+Math.sin(a)*r;g+=`<text x="${x}" y="${y-2}" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#1F2A44">${n}</text><text x="${x}" y="${y+12}" text-anchor="middle" style="font-size:9px;fill:#4A5068">${FLOW_INFO[n].en}</text>`});
  const pos=pts.map((p,i)=>{const e=p.e;let x,y;const ok=e.S!=null&&e.C!=null;
    if(ok){x=(Math.min(5,Math.max(1,e.S))-1)/4*W;y=W-(Math.min(5,Math.max(1,e.C))-1)/4*W;const ang=Math.atan2(y-c,x-c)*180/Math.PI;let dif=Math.abs(((ang-FLOW_ANG[e.cell])%360+540)%360-180);if(dif>22.5||Math.hypot(x-c,y-c)<22)x=null}
    if(x==null){const a=(FLOW_ANG[e.cell]+((i%3)-1)*9)*Math.PI/180,r=W*(0.22+0.05*(i%2));x=c+Math.cos(a)*r;y=c+Math.sin(a)*r}
    return {x:Math.round(x),y:Math.round(y),p}});
  if(opt.focus&&flowStep(opt.focus)){const own=pos.filter(o=>o.p.e.cell===opt.focus);if(own.length){const sx=own.reduce((a,o)=>a+o.x,0)/own.length,sy=own.reduce((a,o)=>a+o.y,0)/own.length;const ta=FLOW_ANG[flowStep(opt.focus)]*Math.PI/180;const tx=c+Math.cos(ta)*W*0.3,ty=c+Math.sin(ta)*W*0.3;const dx=tx-sx,dy=ty-sy,L=Math.hypot(dx,dy)||1;

  pos.forEach((o,i)=>{const last=i===pos.length-1;g+=`<circle cx="${o.x}" cy="${o.y}" r="${last?9:6}" fill="${last?'#2C4BE0':'#6F86F0'}" stroke="#fff" stroke-width="2.5"/>`;if(o.p.lab)g+=`<text x="${o.x}" y="${o.y-11}" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#1F2A44">${esc(o.p.lab)}</text>`});

  return g}
function flowCoach(cell,es){const I=FLOW_INFO[cell];if(!I)return '';const av=f=>{const v=es.filter(e=>e[f]!=null);return v.length?(v.reduce((a,e)=>a+e[f],0)/v.length).toFixed(1):'-'};

    <p class="tiny" style="color:#2C4BE0;font-weight:700;margin-top:6px">데이터 신호</p><p class="small num">난이도 ${av('C')} · 익숙함 ${av('S')} · 몰입감 ${av('F')} <span class="muted">(1~5점, 아이 응답)</span></p>
    <p class="tiny" style="color:#2C4BE0;font-weight:700;margin-top:6px">가정에서는</p><p class="small">${I.tip}</p>

const FLOW_NOTE='<p class="tiny muted">칙센트미하이의 몰입 8채널 모델(Finding Flow, 1997)을 공부에 맞게 옮겼어요. 너무 쉬우면 지루하고, 너무 어려우면 불안해집니다. 위치는 아이가 마음 체크에서 답한 난이도·익숙함으로 정해요.</p>';

    <p class="small" style="color:${dMin>=0?'#2FA06A':'#B3261E'}">${P.min?`지난주 같은 기간보다 ${phm(Math.abs(dMin))} ${dMin>=0?'더':'덜'} 공부했어요`:'지난주 같은 기간 기록이 없어요'}</p>

    ${(()=>{const vo=days.filter(d=>(S.att||{})[d]&&!attStudied(d)).length;return `<p class="tiny muted">출석 도장 ${attStamps(w)}개 (공부 퀘스트를 1개 이상 끝낸 날, 5개면 주간 선물)${vo?` · 앱만 열고 공부는 안 한 날 ${vo}일`:''}</p>`})()}</div>`;
  /* 4. 마음 체크 */

  if(ems.length){const cnt={};ems.forEach(o=>cnt[o.e.cell]=(cnt[o.e.cell]||0)+1);most=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||FLOW_RING.indexOf(a)-FLOW_RING.indexOf(b))[0];

    <div class="card"><div class="row between"><h3>불안·무관심 3일 연속</h3><span class="pill" style="${streakBad?'background:var(--bad);color:#fff':''}">${streakBad?'알림':'괜찮음'}</span></div><p class="small muted">최근 3일: ${last.map(e=>e?e.cell:'기록 없음').join(' → ')}</p></div>
    <div class="card"><div class="row between"><h3>컨디션 '레전드 힘듬' 2회 이상 (7일)</h3><span class="pill" style="${hard>=2?'background:var(--bad);color:#fff':''}">${hard>=2?'알림':hard+'회'}</span></div></div>
    <div class="card"><p class="small">신호가 오면 카톡 또는 문자로 알려드립니다. 힘든 상황이 계속되면 청소년상담 1388에서 상담을 받을 수 있어요.</p></div>`;
  }
  scr.innerHTML=h;if(t==='week')bindParentWeek();
}

function adopt(remote){S=JSON.parse(JSON.stringify(remote));if(!S.rev)S.rev=0}
function canRerender(){return !document.querySelector('.sheet')&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))&&!(UI.tab==='emo')&&S.char}
function setFoot(){const f=document.getElementById('foot');if(!f)return;
  f.textContent=PARENT_CODE?'학부모 화면 · 읽기 전용':NEED_LOGIN?'':!API?'서버 주소(config.js)가 없어 이 기기에만 저장돼요.':
   ({ok:'기록은 자동으로 서버에 저장돼요 ✓',saving:'저장 중...',wait:'곧 저장돼요',fail:'저장 대기 중 · 인터넷이 되면 자동으로 올라가요',offline:'서버에 연결하지 못해 이 기기에 보관 중이에요',loading:'기록을 불러오는 중...'}[SYNC]||'')}
async function loadParent(){try{const j=await api('parent',{code:PARENT_CODE});S=j.state?JSON.parse(j.state):freshState();PARENT_ERR=''}catch(e){if(!S.char){S=freshState();PARENT_ERR=e.message}}LOADING=false;setFoot();render()}
async function boot(){
  if(PARENT_CODE){render();await loadParent();setInterval(()=>{if(!document.hidden)loadParent()},5*60000);return}
  if(!API){S=load()||freshState();LOADING=false;setFoot();render();return}
  if(!AUTH||!AUTH.token){LOADING=false;NEED_LOGIN=true;setFoot();render();checkVersion();return}
  checkVersion();startSession();
}
boot();
})();
</script>
