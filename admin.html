<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>스터디아 왕국 TEEN 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="config.js"></script>
<style>
:root{--bg:#FBF4E6;--paper:#FFFDF8;--ink:#3A2C22;--muted:#8A7766;--line:#EADFCB;--accent:#F08A4B;--soft:#FDE6D3;--good:#3E9B6B;--bad:#D2504A;--purple:#7A4FD0;
  --f-display:'Jua',system-ui,sans-serif;--f-body:'Noto Sans KR',system-ui,-apple-system,sans-serif;--shadow:0 2px 0 rgba(90,60,30,.06),0 8px 24px rgba(90,60,30,.05)}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;letter-spacing:.2px}
h1{font-size:26px}h2{font-size:20px}h3{font-size:17px}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .sp{flex:1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert b{color:var(--bad)}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:500}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;color:inherit;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;width:100%}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;align-items:end}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--soft);white-space:nowrap}
.pill.off{background:#eee;color:#888}.pill.bad{background:#F8D9D6;color:#9B2C25}.pill.p{background:#E9DDFB;color:#4B2E8F}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.wrapcell{white-space:normal;min-width:220px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto}
.tabs button{border:0;background:transparent;border-radius:10px;padding:8px 12px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--soft);color:var(--ink);font-weight:700}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.err{border-left:4px solid var(--bad);padding:6px 10px;background:#fff;border-radius:8px}
.err.rep{border-left-color:var(--purple)}
.err pre{white-space:pre-wrap;word-break:break-all;font-size:11px;color:var(--muted);margin:4px 0 0;max-height:120px;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;max-width:90%}
.login{max-width:380px;margin:12vh auto 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--ink);font-weight:700}
.issue{border-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.kv dt{color:var(--muted);font-size:13px}.kv dd{margin:0;font-weight:700;word-break:break-all}
.kv dd.link{font-weight:500;font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.two .note{flex:1}
.per{display:flex;flex-direction:column;gap:8px}
.per .row select{width:auto;padding:7px 10px;border-radius:10px;font-size:14px}
.per .btn.ghost[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
a.ana{font-size:12px;margin-left:4px;white-space:nowrap}
.pill.mid{background:#DDF0E5;color:#23663F}.pill.high{background:#DCE8FA;color:#234E8C}
[hidden]{display:none!important}
@media (max-width:600px){.wrap{padding:12px}th,td{padding:7px 4px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
const API=String((window.RR_CONFIG||{}).API_URL||'').trim();
const BASE=location.origin+location.pathname.replace(/admin\.html$/,'');
const KEY='rr-admin-v1';
const KINGDOM={dopa:['도파밍 왕국','#E8559A'],nj:['느좋 공화국','#C9925E'],gds:['감다살 왕국','#F07B3F'],ddk:['딸깍 제국','#3E8EDB'],hc:['하드캐리 연방','#D64545'],ft:['풀템 제국','#8D6E4A'],gim:['고인물 요새','#4C7A5A'],ult:['궁극기 왕국','#7A4FD0'],ukk:['억까탈출 공화국','#2BA7A0']};
let AUTH=null;try{AUTH=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
let PER=(()=>{try{return JSON.parse(localStorage.getItem(KEY+':per')||'null')}catch(e){return null}})()||{k:'today'};
let NEW_SCHOOL='mid',BULK_SCHOOL='mid',D=null,TAB='home',LAST_ERR_SEEN=+(localStorage.getItem(KEY+':errseen')||0),timer=null,busy=false;
const app=document.getElementById('app');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>app.querySelector(s);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function api(action,data){
  if(!API)throw new Error('config.js 에 서버 주소가 없어요');
  let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:AUTH&&AUTH.token||''},data||{}))})}catch(e){throw new Error('인터넷 연결을 확인해 주세요')}
  const j=await r.json().catch(()=>({ok:false,error:'서버 응답을 읽지 못했어요'}));
  if(!j.ok){if(j.code==='auth'||j.code==='forbidden'){logout(j.error)}const e=new Error(j.error);e.code=j.code;throw e}return j}
function logout(msg){AUTH=null;localStorage.removeItem(KEY);clearInterval(timer);D=null;render();if(msg)toast(msg)}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast('복사했어요')).catch(()=>{prompt('아래 내용을 복사하세요',t)})}

/* 날짜 (앱과 같은 규칙: 새벽 2시 마감) */
function parse(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function add(k,n){const d=parse(k);d.setDate(d.getDate()+n);return key(d)}
function weekStart(k){const d=parse(k);return add(k,-((d.getDay()+6)%7))}
function fmt(k){const d=parse(k);return (d.getMonth()+1)+'/'+d.getDate()+'('+'일월화수목금토'[d.getDay()]+')'}
function ago(iso){if(!iso)return '-';const t=new Date(iso);if(isNaN(t))return '-';const m=Math.round((Date.now()-t)/60000);if(m<1)return '방금';if(m<60)return m+'분 전';if(m<1440)return Math.round(m/60)+'시간 전';return Math.round(m/1440)+'일 전'}
function sumRange(daily,from,to,f){let s=0;Object.keys(daily||{}).forEach(k=>{if(k>=from&&k<=to)s+=(daily[k][f||'r']||0)});return s}
/* 기간 고르기 (키즈 관리자와 같은 방식) */
function savePer(){try{localStorage.setItem(KEY+':per',JSON.stringify(PER))}catch(e){}}
function span(a,b){return fmt(a)+(a===b?'':'~'+fmt(b))}
function period(today){const ws=weekStart(today),ms=today.slice(0,8)+'01';const k=PER.k;
  if(k==='yesterday'){const y=add(today,-1);return {from:y,to:y,name:'어제',label:'어제 '+fmt(y)}}
  if(k==='week')return {from:ws,to:today,name:'이번 주',label:'이번 주 '+span(ws,add(ws,6))};
  if(k==='lastweek'){const a=add(ws,-7);return {from:a,to:add(a,6),name:'지난주',label:'지난주 '+span(a,add(a,6))}}
  if(k==='month')return {from:ms,to:today,name:'이번 달',label:'이번 달 '+(+today.slice(5,7))+'월'};
  if(k==='pw'&&PER.v){const a=PER.v;return {from:a,to:add(a,6),name:fmt(a)+' 주',label:span(a,add(a,6))+' 주'}}
  if(k==='pm'&&PER.v){const a=PER.v+'-01',d=parse(a);d.setMonth(d.getMonth()+1);d.setDate(0);return {from:a,to:key(d),name:(+PER.v.slice(5,7))+'월',label:PER.v.slice(0,4)+'년 '+(+PER.v.slice(5,7))+'월'}}
  return {from:today,to:today,name:'오늘',label:'오늘 '+fmt(today)}}
function weekOpts(today,since){const out=[];let a=weekStart(today);for(let i=0;i<14&&add(a,6)>=since;i++,a=add(a,-7))out.push(a);return out}
function monthOpts(today,since){const out=[];const d=parse(today.slice(0,8)+'01');for(let i=0;i<4;i++){const k=key(d).slice(0,7);if(k+'-31'<since)break;out.push(k);d.setMonth(d.getMonth()-1)}return out}
function topCell(daily,from,to){const c={};Object.keys(daily||{}).forEach(k=>{if(k>=from&&k<=to&&daily[k].cell)c[daily[k].cell]=(c[daily[k].cell]||0)+1});const b=Object.keys(c).sort((x,y)=>c[y]-c[x])[0];return b?[b,c[b]]:null}
function dmgRange(s,from,to){let t=0;Object.keys(s.daily||{}).forEach(k=>{if(k<from||k>to)return;t+=(s.dd&&s.dd[k]!=null)?s.dd[k]:(s.daily[k].raw||0)*10});return t}
const BADCELL=['불안','무관심','걱정'];

const SCHOOLS={mid:'중학생',high:'고등학생'};
const schoolPill=v=>v?`<span class="pill ${v}">${v==='mid'?'중등':'고등'}</span>`:'<span class="pill off">미정</span>';
function studentLinkText(s,pw){return `[스터디아 왕국 TEEN] 입장 안내\n\n접속 주소: ${BASE}\n아이디: ${s.id}\n비밀번호: ${pw||'(선생님께 받은 비밀번호)'}${s.school?'\n학교: '+SCHOOLS[s.school]+' (시험 레이드 보스가 '+(s.school==='mid'?'중간·기말·방학 보스':'중간·기말·모의고사 보스')+'로 나와요)':''}\n\n처음 들어가면 성향 테스트로 왕국을 정하고 캐릭터를 만들어요. 홈 화면에 추가해 두면 앱처럼 쓸 수 있어요.\n비밀번호는 [나] 탭에서 바꿀 수 있어요.\n\n사용 가이드(점수 규칙·보스전): ${BASE}support/student.html\n궁금할 때 지원센터: ${BASE}support/`}
function parentText(s){return `[스터디아 왕국 TEEN] ${s.name} 학부모 리포트\n${parentLink(s)}\n\n로그인 없이 열리는 읽기 전용 화면이에요. 오늘 공부·이번 주 점수·감정 체크를 볼 수 있고, 다른 학생과의 순위는 보이지 않아요. 이 링크는 다른 분께 전달하지 말아 주세요.\n\n학부모 가이드(리포트 보는 법): ${BASE}support/parent.html\n지원센터: ${BASE}support/`}
function bothText(s,pw){return studentLinkText(s,pw)+'\n\n──────────\n\n'+parentText(s)}
function issueCard(s,pw,title){const st=studentLinkText(s,pw),pt=parentText(s),bt=bothText(s,pw);const c=t=>`<button class="btn ghost sm" data-copy="${encodeURIComponent(t)}">복사</button>`;
  return `<div class="card issue"><div class="row"><h3 style="flex:1">${esc(title||s.name+' 계정을 만들었어요')}</h3>${schoolPill(s.school)}</div>
  <dl class="kv"><dt>접속 주소</dt><dd class="link">${esc(BASE)}</dd>${c(BASE)}<dt>아이디</dt><dd>${esc(s.id)}</dd>${c(s.id)}${pw?`<dt>비밀번호</dt><dd>${esc(pw)}</dd>${c(pw)}`:''}<dt>학부모 리포트</dt><dd class="link">${esc(parentLink(s))}</dd>${c(parentLink(s))}<dt>지원센터</dt><dd class="link">${esc(BASE+'support/')}</dd>${c(BASE+'support/')}</dl>
  ${pw?'<p class="small muted">비밀번호는 지금만 보여요. 이 화면을 닫기 전에 안내문을 보내 주세요.</p>':''}
  <div class="two"><div class="card" style="box-shadow:none"><div class="row"><b style="flex:1">학생에게 보낼 안내문</b><button class="btn sm" data-copy="${encodeURIComponent(st)}">복사</button></div><div class="note">${esc(st)}</div></div>
  <div class="card" style="box-shadow:none"><div class="row"><b style="flex:1">학부모님께 보낼 안내문</b><button class="btn sm" data-copy="${encodeURIComponent(pt)}">복사</button></div><div class="note">${esc(pt)}</div></div></div>
  <div class="row"><button class="btn sm" data-copy="${encodeURIComponent(bt)}">학생 + 학부모 안내 한 번에 복사</button><a class="btn ghost sm" href="${esc(parentLink(s))}" target="_blank" rel="noopener" style="text-decoration:none">학부모 화면 열어 보기</a></div></div>`}
function parentLink(s){return BASE+'#parent-'+s.parentCode}

function render(){
  if(!AUTH){app.innerHTML=`<div class="card login"><h1>스터디아 왕국 TEEN 관리자</h1><p class="small muted">구글 시트에서 [처음 설정] 때 만든 관리자 아이디로 로그인해요.</p>
    ${API?'':'<p class="note">config.js 에 앱스크립트 웹 앱 주소가 아직 없어요. 설치 안내서 3단계를 봐 주세요.</p>'}
    <form id="lf" style="display:flex;flex-direction:column;gap:8px"><label>아이디<input id="id" autocomplete="username" autocapitalize="none"></label><label>비밀번호<input id="pw" type="password" autocomplete="current-password"></label>
    <p class="small" id="le" style="color:var(--bad)" hidden></p><button class="btn" id="go">로그인</button></form></div>`;
    $('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#go');b.disabled=true;b.textContent='확인 중...';
      try{const j=await api('login',{id:$('#id').value.trim().toLowerCase(),pw:$('#pw').value});
        if(j.role!=='admin')throw new Error('관리자 계정이 아니에요. 학생은 '+BASE+' 에서 들어가요');
        AUTH={token:j.token,id:j.id};localStorage.setItem(KEY,JSON.stringify(AUTH));refresh(true)}
      catch(x){const le=$('#le');le.hidden=false;le.textContent=x.message;b.disabled=false;b.textContent='로그인'}};return}
  if(!D){app.innerHTML='<div class="card"><h2>불러오는 중...</h2><p class="small muted">구글 시트에서 학생 기록을 읽고 있어요. 1~3초 걸려요.</p></div>';return}
  const stu=D.students.filter(s=>s.role==='student');const real=stu.filter(s=>!isH(s));const helpers=stu.filter(isH);const today=D.today,ws=weekStart(today),ms=today.slice(0,8)+'01';
  const doneToday=real.filter(s=>s.daily[today]&&s.daily[today].raw>0).length;
  const newErr=D.errors.filter(e=>new Date(e.time).getTime()>LAST_ERR_SEEN).length;
  let h=`<div class="top"><h1>스터디아 왕국 TEEN 관리자</h1><span class="pill">${fmt(today)}</span><span class="sp"></span>
    <span class="tiny muted" id="upd">방금 새로 고침</span><a class="btn ghost sm" href="support/" target="_blank" rel="noopener" style="text-decoration:none">지원센터</a><a class="btn ghost sm" href="rank.html" target="_blank" rel="noopener" style="text-decoration:none">랭킹 사이트</a>${D.links&&D.links.sheet?`<a class="btn ghost sm" href="${esc(D.links.sheet)}" target="_blank" rel="noopener" style="text-decoration:none">구글 시트</a>`:''}${D.links&&D.links.script?`<a class="btn ghost sm" href="${esc(D.links.script)}" target="_blank" rel="noopener" style="text-decoration:none">앱스크립트</a>`:''}<button class="btn ghost sm" id="rf">새로 고침</button><button class="btn ghost sm" id="lo">로그아웃</button></div>
  <div class="tabs">${[['home','오늘'],['students','학생 계정'],['new','계정 만들기'],['helpers','AI 헬퍼'+(D.helperOn?' · 켜짐':'')],['errors','오류 기록'+(newErr?' ('+newErr+')':'')]].map(([k,l])=>`<button data-t="${k}" aria-pressed="${TAB===k}">${l}</button>`).join('')}</div>`;
  if(TAB==='home'){
    const since=D.since||add(today,-13),P=period(today),to=P.to>today?today:P.to;
    const days=Math.max(1,Math.round((parse(to)-parse(P.from))/864e5)+1);
    const did=s=>Object.keys(s.daily||{}).filter(k=>k>=P.from&&k<=to&&s.daily[k].raw>0).length;
    const act=real.filter(s=>s.active),checked=act.filter(s=>did(s)>0).length;
    const avg=act.length?Math.round(act.reduce((t,s)=>t+sumRange(s.daily,P.from,to),0)/act.length):0;
    const cells={};stu.filter(s=>s.active).forEach(s=>Object.keys(s.daily||{}).forEach(k=>{const e=s.daily[k];if(k>=P.from&&k<=to&&e.cell)cells[e.cell]=(cells[e.cell]||0)+1}));
    const wo=weekOpts(today,since),mo=monthOpts(today,since);
    const pb=(k,l)=>`<button class="btn ghost sm" data-per="${k}" aria-pressed="${PER.k===k}">${l}</button>`;
    h+=`<div class="card per"><div class="row">${pb('today','오늘')}${pb('yesterday','어제')}${pb('week','이번 주')}${pb('lastweek','지난주')}${pb('month','이번 달')}
      <select id="pw" aria-label="주 고르기"><option value="">주 고르기</option>${wo.map(w=>`<option value="${w}" ${PER.k==='pw'&&PER.v===w?'selected':''}>${fmt(w)}~${fmt(add(w,6))}</option>`).join('')}</select>
      <select id="pm" aria-label="달 고르기"><option value="">달 고르기</option>${mo.map(m=>`<option value="${m}" ${PER.k==='pm'&&PER.v===m?'selected':''}>${m.slice(0,4)}년 ${+m.slice(5,7)}월</option>`).join('')}</select></div>

    try{const j=await api('adminReset',{id:s.id,pw:want.trim()});showOut(issueCard(s,j.pw,s.name+' 새 비밀번호를 만들었어요 (예전 기기의 로그인은 풀려요)'));b.textContent='발급 완료'}catch(e){toast(e.message);b.disabled=false}});
  app.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{const s=find(b.dataset.pl);const t=parentText(s);showOut(`<div class="card"><h3>${esc(s.name)} 학부모 링크</h3><div class="note">${esc(t)}</div><div class="row"><button class="btn sm" data-copy="${encodeURIComponent(t)}">복사</button><a class="btn ghost sm" href="${esc(parentLink(s))}" target="_blank" rel="noopener">열어 보기</a></div><p class="tiny muted">링크가 새어 나갔다면 시트 [계정] 탭의 학부모코드를 지우고 새로 넣으면 예전 링크는 막혀요.</p></div>`)});

  if($('#nf'))$('#nf').onsubmit=async e=>{e.preventDefault();const b=$('#ngo');b.disabled=true;
    try{const j=await api('adminCreate',{id:$('#nid').value,name:$('#nnm').value,pw:$('#npw').value,memo:$('#nmemo').value,school:NEW_SCHOOL});
      showOut(issueCard({...j,school:j.school||NEW_SCHOOL},j.pw));
      $('#nf').reset();refresh()}catch(x){toast(x.message)}b.disabled=false};
  app.querySelectorAll('[data-ns]').forEach(b=>b.onclick=()=>{NEW_SCHOOL=b.dataset.ns;app.querySelectorAll('[data-ns]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  app.querySelectorAll('[data-bs]').forEach(b=>b.onclick=()=>{BULK_SCHOOL=b.dataset.bs;app.querySelectorAll('[data-bs]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const s=find(b.dataset.del);const t=prompt(`${s.name}(${s.id}) 계정을 완전히 지울까요?\n점수·체크 기록도 모두 지워지고 되돌릴 수 없어요.\n지우려면 아이디 ${s.id} 를 똑같이 입력하세요.`);if(t===null)return;if(t.trim().toLowerCase()!==s.id){toast('아이디가 달라서 지우지 않았어요');return}b.disabled=true;try{await api('adminDelete',{id:s.id,confirm:t.trim()});toast(`${s.id} 계정을 지웠어요`);refresh()}catch(e){toast(e.message);b.disabled=false}});
  if($('#bgo'))$('#bgo').onclick=async e=>{const lines=$('#bulk').value.split('\n').map(x=>x.split(/[,\t]/).map(y=>y.trim())).filter(x=>x[0]);if(!lines.length)return;const b=e.target;b.disabled=true;const res=[];
    const sc=v=>{v=String(v||'').trim();return /^(중|중등|중학생|mid|m)$/i.test(v)?'mid':/^(고|고등|고등학생|high|h)$/i.test(v)?'high':BULK_SCHOOL};
    for(const [id,name,memo,school] of lines){b.textContent=`만드는 중 ${res.length+1}/${lines.length}`;const want=sc(school);try{const j=await api('adminCreate',{id,name:name||id,memo:memo||'',school:want});res.push({ok:1,...j,school:j.school||want})}catch(x){res.push({ok:0,id,name,err:x.message})}}
    const ok=res.filter(r=>r.ok);
    const txt=['이름\t아이디\t비밀번호\t학교\t학부모 리포트'].concat(ok.map(r=>`${r.name}\t${r.id}\t${r.pw}\t${r.school?SCHOOLS[r.school]:''}\t${parentLink(r)}`)).join('\n');
    const all=ok.map(r=>bothText(r,r.pw)).join('\n\n══════════\n\n');
    showOut(`<div class="card issue"><h3>${ok.length}명 만들었어요${res.length>ok.length?` · ${res.length-ok.length}명 실패`:''}</h3><p class="small muted">비밀번호는 지금만 보여요. 학생마다 안내문을 복사해 보내거나, 표를 엑셀에 붙여 보관하세요.</p><div class="tscroll"><table><thead><tr><th>이름</th><th>아이디</th><th>비밀번호</th><th>학교</th><th></th></tr></thead><tbody>${res.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.id)}</td><td>${r.ok?'<b>'+esc(r.pw)+'</b>':'<span style="color:var(--bad)">'+esc(r.err)+'</span>'}</td><td>${r.ok?schoolPill(r.school):''}</td><td>${r.ok?`<div class="row"><button class="btn ghost sm" data-copy="${encodeURIComponent(studentLinkText(r,r.pw))}">학생 안내</button><button class="btn ghost sm" data-copy="${encodeURIComponent(parentText(r))}">학부모 안내</button></div>`:''}</td></tr>`).join('')}</tbody></table></div><div class="row"><button class="btn sm" data-copy="${encodeURIComponent(all)}">모든 안내문 한 번에 복사</button><button class="btn ghost sm" data-copy="${encodeURIComponent(txt)}">표 전체 복사 (엑셀에 붙여넣기)</button></div></div>`);
    b.disabled=false;b.textContent='모두 만들기';$('#bulk').value='';refresh()};
  const hset=async(on,b)=>{b.disabled=true;b.textContent=on?'켜는 중...':'끄는 중...';try{const j=await api('adminHelperSet',{on});D.helperOn=j.helperOn;toast(on?'AI 헬퍼 자동 공부를 켰어요':'AI 헬퍼 자동 공부를 껐어요');render()}catch(e){toast(e.message);b.disabled=false;b.textContent=on?'자동 공부 켜기':'끄기'}};
  if($('#hon'))$('#hon').onclick=e=>hset(true,e.target);
  if($('#hoff'))$('#hoff').onclick=e=>hset(false,e.target);
  if($('#ce'))$('#ce').onclick=async e=>{const b=e.target;if(!b.dataset.c){b.dataset.c=1;b.textContent='한 번 더 누르면 모두 지워요';return}try{await api('adminClearErrors');toast('지웠어요');refresh()}catch(x){toast(x.message)}};
}
let lastAt=0;
async function refresh(show){if(busy)return;busy=true;if(show&&!D)render();
  try{D=await api('adminOverview');lastAt=Date.now();const keep=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);const out=$('#out');const outHtml=out?out.innerHTML:'';
    if(!keep){render();if(outHtml&&$('#out')){showOut(outHtml)}}}
  catch(e){if(AUTH)toast(e.message)}busy=false;
  clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)refresh()},30000)}
setInterval(()=>{const u=document.getElementById('upd');if(u&&lastAt)u.textContent=ago(new Date(lastAt).toISOString())+' 새로 고침'},15000);
render();if(AUTH)refresh(true);
})();
</script>
</body>
</html>
