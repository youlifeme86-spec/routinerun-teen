    var c=document.getElementById('content');c.innerHTML=new TextDecoder().decode(pt);c.hidden=false;
    document.getElementById('lock').remove();
    if(location.hash){var t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}
  }
  var f=document.getElementById('lf'),err=document.getElementById('err'),go=document.getElementById('go');
  f.onsubmit=async function(e){e.preventDefault();var pw=document.getElementById('pw').value;if(!pw)return;
    go.disabled=true;go.textContent='확인 중...';err.hidden=true;
    try{await open(pw);try{sessionStorage.setItem(K,pw)}catch(x){}}
    catch(x){err.hidden=false;err.textContent=window.crypto&&crypto.subtle?'비밀번호가 맞지 않아요':'이 브라우저에서는 열 수 없어요. 최신 크롬·사파리로 열어 주세요.';go.disabled=false;go.textContent='열기'}};
  var saved=null;try{saved=sessionStorage.getItem(K)}catch(x){}
  if(saved)open(saved).catch(function(){try{sessionStorage.removeItem(K)}catch(x){}});
  else setTimeout(function(){document.getElementById('pw').focus()},50);
})();
</script>
</body>
